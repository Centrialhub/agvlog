# Auth profile for a separately restored, verified and seeded local catalog.
# Reviewed against Supabase CLI 2.116.0; do not copy the production config here.
project_id = "agvlog-local-staging"

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
shadow_port = 55320
major_version = 17

[db.pooler]
enabled = false

# Baseline/forwards/seed are applied separately; never replay them on start.
[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1"
openai_api_key = ""

# Local mail capture only; no external SMTP credentials.
[local_smtp]
enabled = true
port = 55324

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://127.0.0.1:4173", "http://localhost:4173"]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"

# CLI maps this field to the email/password provider; global signup stays disabled.
[auth.email]
enable_signup = true
enable_confirmations = true

[auth.sms]
enable_signup = false

# The preparation command verifies this function, Auth-role execution and grants.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

# No application functions or integration secrets are provisioned at bootstrap.
[edge_runtime]
enabled = false

[analytics]
enabled = false
