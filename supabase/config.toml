[auth]
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
password_requirements = "lower_upper_letters_digits"
site_url = "https://agvlog.lovable.app"
additional_redirect_urls = ["https://agvlog.lovable.app/set-password"]

[auth.sessions]
timebox = "8h"
inactivity_timeout = "30m"

[auth.rate_limit]
email_sent = 10
token_refresh = 60
sign_in_sign_ups = 10
token_verifications = 10

[auth.email]
# Keep the email/password provider active for invited users. Global self-signup
# remains disabled by [auth].enable_signup above.
enable_signup = true
double_confirm_changes = true
secure_password_change = true
max_frequency = "1m"
otp_length = 6
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 5

[auth.mfa.totp]
# Login uses email and password; authenticator enrollment is disabled.
enroll_enabled = false
verify_enabled = false

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

