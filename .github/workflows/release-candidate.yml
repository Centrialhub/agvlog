name: Release candidate verification

on:
  workflow_dispatch:
    inputs:
      candidate_url:
        description: Immutable agvlogistica Vercel deployment URL produced from the candidate commit
        required: true
        type: string
      candidate_sha:
        description: Full 40-character commit SHA used to build the candidate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.event.inputs.candidate_sha }}
  cancel-in-progress: false

jobs:
  verify-hosted-candidate:
    environment: release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEPLOY_SMOKE_URL: ${{ github.event.inputs.candidate_url }}
      DEPLOY_EXPECTED_RELEASE: ${{ github.event.inputs.candidate_sha }}
      DEPLOY_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      DEPLOY_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPABASE_PROJECT_ID: staging
      E2E_BASE_URL: ${{ github.event.inputs.candidate_url }}
      E2E_ALLOW_REMOTE: "true"
      E2E_SKIP_WEBSERVER: "true"
    steps:
      - name: Checkout trusted release policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Verify candidate URL belongs to this Vercel project
        env:
          CANDIDATE_URL: ${{ github.event.inputs.candidate_url }}
        run: node scripts/check-release-candidate-url.mjs

      - name: Checkout candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.inputs.candidate_sha }}
          persist-credentials: false

      - name: Verify immutable candidate identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.inputs.candidate_sha }}
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be a full lowercase commit SHA" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Frozen install and audit
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lockfile:check
          npm run repository:check
          npm run supabase:release:check

      - name: Verify deployed security and hosted signup policy
        run: npm run smoke:deploy

      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Hosted desktop/tablet/mobile journeys
        env:
          E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
        run: npm run e2e

      - name: Critical journeys three consecutive times
        env:
          E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
        run: npm run e2e:critical:3

      - name: Upload hosted evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.event.inputs.candidate_sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30
